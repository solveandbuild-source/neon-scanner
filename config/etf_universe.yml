# ETF universe for the /flows page.
#
# 35 tickers in three buckets: cross-asset, US sectors (11 SPDRs), themes.
# Edit freely — the ingester reads this YAML and fetches whatever's listed.
#
# 'category' controls which section the ticker appears in on /flows.
# 'subtype' is finer grouping for sorting/grouping within a section.
# 'label' is the display name on the UI (shorter than long_name).

etfs:
  # ─── Cross-asset (8) ─────────────────────────────────────────────────────
  - ticker: SPY
    label: US Equities (broad)
    category: cross_asset
    subtype: equity
    long_name: SPDR S&P 500 ETF
  - ticker: QQQ
    label: US Tech (Nasdaq-100)
    category: cross_asset
    subtype: equity
    long_name: Invesco QQQ Trust
  - ticker: IEF
    label: US Treasuries (7-10y)
    category: cross_asset
    subtype: bonds
    long_name: iShares 7-10 Year Treasury Bond ETF
  - ticker: TLT
    label: US Treasuries (20y+)
    category: cross_asset
    subtype: bonds
    long_name: iShares 20+ Year Treasury Bond ETF
  - ticker: GLD
    label: Gold
    category: cross_asset
    subtype: commodity
    long_name: SPDR Gold Shares
  - ticker: IBIT
    label: Bitcoin
    category: cross_asset
    subtype: crypto
    long_name: iShares Bitcoin Trust
  - ticker: EFA
    label: International Developed
    category: cross_asset
    subtype: foreign_equity
