# Tracked filers — 29 fund managers + 10 corporate strategic investors.
#
# Categories:
#   value                - long-horizon value/generalist managers
#   concentrated         - high-conviction concentrated/contrarian books
#   growth               - growth/tech books (Tiger cubs)
#   activist             - 13D-filers who actively push for change; weighted heaviest
#   macro                - macro/credit/event-driven (low coverage_pct typical)
#   corporate_strategic  - public companies whose strategic investments are
#                          signal-bearing (e.g. NVIDIA's $5B Intel stake).
#                          They file 8-K, not 13F. See CLAUDE.md §6.0.
#
# Inclusion rule (softened): include a filer if their disclosed equity book
# represents *intentional, thesis-driven* positions — even if only a small
# fraction of their total AUM. Per-filer 'coverage_pct' annotation in
# web/lib/filers.ts records what fraction is visible; signals are weighted
# accordingly so a Bridgewater 13F-new contributes less than a Buffett one.
# This replaces the earlier "exclude if 13F unrepresentative" rule.
#
# History of curation decisions (so future-you doesn't re-add these):
#   - ARK Investment Management (Wood) — dropped: originally included only
#     for daily-trade CSV access (§6.0), which ARK has since restricted to
#     email signup. Without daily granularity, the quarterly 13F adds little
#     given their poor recent stock-picking record.
#   - Renaissance Technologies — excluded permanently: positions are
#     algorithmic baskets (signal_class: algorithmic_basket), not thesis
#     picks. Even at 100% coverage, no human at RenTech 'chose' these names.
#
# multiplier applies to ALL signals from this filer in the confluence scorer.
# Per the user's stated rationale, activists are weighted heaviest because
# 13D filings from them have historically had higher hit rates.
#
# CIK lookup: https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany
# Almost all CIKs below are intentionally null — Claude Code: look these up
# from EDGAR rather than guessing. Wrong CIKs silently corrupt ingestion.
# Only filled in the few CIKs I'm certain on; do not invent the rest.

